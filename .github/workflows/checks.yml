name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-venv python3-gi gir1.2-atspi-2.0 shellcheck
      - name: Python environment
        run: |
          python3 -m venv .venv --system-site-packages
          .venv/bin/pip install -q -r requirements.txt pytest
          .venv/bin/pip install -q --no-deps -r requirements-nodeps.txt
      - name: pytest
        run: .venv/bin/python -m pytest -q
      - name: ShellCheck
        run: shellcheck -S warning install.sh ccp bin/* hosts/macos/setup.sh hosts/macos/ccp
  powershell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Parse and analyze every .ps1
        shell: pwsh
        run: ./tools/check-ps1.ps1
