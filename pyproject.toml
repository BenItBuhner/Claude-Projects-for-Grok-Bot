[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-projects"
version = "1.0.8"
description = "Claude Code Projects for Grok Bot: an MCP server and CLI that drive the Claude desktop app's Projects"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
claude-projects = "claude_projects.__main__:main"

[tool.setuptools]
packages = ["claude_projects"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["docs", "hosts"]

[tool.ruff.lint]
# pyflakes (unused or undefined names, redefinitions), syntax errors, and suppressions that no longer suppress anything
select = ["F", "E9", "RUF100"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["claude_projects", "tools"]
